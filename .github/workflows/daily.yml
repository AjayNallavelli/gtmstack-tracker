name: daily-scrape-and-deploy
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC daily = 08:00 IST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data/snapshots/**", "data/changes.json", "**.md"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Snapshot pricing pages + diff
        # The first CI run re-baselines (runner region = US, prices may differ from the
        # locally-captured baseline). data/ci_baseline.json marks that it has happened.
        if: github.event_name != 'push'
        env:
          CHROME_BIN: google-chrome
        run: python scripts/snapshot.py --baseline-marker data/ci_baseline.json
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "gtmstack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: snapshot $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site + check links
        run: python scripts/build.py && python scripts/check_links.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
